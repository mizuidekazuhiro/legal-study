[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "legal-study"
version = "0.1.0"
description = "Restartable, evidence-first pipeline for Japanese legal-study PDFs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pymupdf>=1.26.0",
  "pydantic>=2.8.0",
  "typer>=0.12.0",
  "rich>=13.7.0",
  "Pillow>=10.4.0",
  "PyYAML>=6.0.2",
]

[project.optional-dependencies]
api = [
  "openai>=2.0.0",
]
notion = [
  "notion-client>=3.1.0,<4.0.0",
]
ocr = [
  "paddleocr>=3.7.0,<3.8.0",
  "paddlepaddle>=3.2.0,<3.3.0",
  "numpy>=1.24,<2.4",
]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.6.0",
]

[project.scripts]
legal-study = "legal_study.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/legal_study"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
